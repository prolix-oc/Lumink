name: Release Lumink

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, matching spindle.json and package.json (for example v0.1.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lumink-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Validate release version
        id: metadata
        run: bun run scripts/package-release.ts --check "$RELEASE_TAG"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build and package the extension
        run: bun run package

      - name: Check archive integrity
        working-directory: release
        run: |
          unzip -t lumink.zip
          sha256sum --check lumink.zip.sha256

      - name: Publish GitHub release for Illarin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the release as a draft until both assets are attached.
          if release_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$release_draft" != 'true' ]]; then
              echo "Release $RELEASE_TAG is already published; its assets will not be replaced." >&2
              exit 1
            fi
          else
            release_flags=(--draft --verify-tag --generate-notes --title "Lumink $RELEASE_TAG")
            if [[ "$RELEASE_PRERELEASE" == 'true' ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/lumink.zip release/lumink.zip.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$RELEASE_PRERELEASE" --verify-tag

      - name: Record release details
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          printf 'Published Lumink %s with `lumink.zip` and its SHA-256 checksum.\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '\nIn Illarin, select **Named attachment** and enter exactly `lumink.zip`.\n' >> "$GITHUB_STEP_SUMMARY"
